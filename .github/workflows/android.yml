name: Build Android App

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "MadixBeam/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the APK as a GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: MadixBeam
    env:
      MADIX_KEYSTORE_BASE64: ${{ secrets.MADIX_KEYSTORE_BASE64 }}
      MADIX_KEYSTORE_PASSWORD: ${{ secrets.MADIX_KEYSTORE_PASSWORD }}
      MADIX_KEY_ALIAS: ${{ secrets.MADIX_KEY_ALIAS }}
      MADIX_KEY_PASSWORD: ${{ secrets.MADIX_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Protocol test suite
        run: ./gradlew --no-daemon --stacktrace :core:protocol:test

      - name: Compile application
        timeout-minutes: 25
        run: ./gradlew --no-daemon --stacktrace :app:compileReleaseKotlin

      - name: Assemble release APK
        timeout-minutes: 25
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Sign and verify release APK
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          mkdir -p dist

          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/MadixBeam-$VERSION.apk"
          else
            if [ -n "${MADIX_KEYSTORE_BASE64:-}" ]; then
              echo "Signing with the release key from repository secrets."
              KS="$RUNNER_TEMP/release.jks"
              echo "$MADIX_KEYSTORE_BASE64" | base64 -d > "$KS"
              KS_PASS="$MADIX_KEYSTORE_PASSWORD"
              ALIAS="$MADIX_KEY_ALIAS"
              KEY_PASS="${MADIX_KEY_PASSWORD:-$MADIX_KEYSTORE_PASSWORD}"
            else
              echo "::warning::No release key configured; signing with a one-time key for this build."
              KS="$RUNNER_TEMP/one-time.p12"
              KS_PASS=$(openssl rand -hex 24)
              ALIAS=madix
              KEY_PASS="$KS_PASS"
              keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass "$KS_PASS" -keypass "$KEY_PASS" \
                -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Madix Beam, O=Madix" > /dev/null
            fi
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$KS_PASS" --ks-key-alias "$ALIAS" --key-pass "pass:$KEY_PASS" \
              --out "dist/MadixBeam-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
            rm -f "$KS"
          fi

          for apk in dist/*.apk; do
            echo "== $apk"
            "$BT/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/verify.txt"
            sed -n '1,3p' "$RUNNER_TEMP/verify.txt"
            "$BT/zipalign" -c -p 4 "$apk" && echo "zipalign: OK"
            "$BT/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|application-label:)" || true
          done
          rm -f dist/*.idsig
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          ls -la dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MadixBeam-apk
          path: |
            MadixBeam/dist/*.apk
            MadixBeam/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: MadixBeam/core/protocol/build/reports/tests/
          if-no-files-found: ignore

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          NOTES="Madix Beam $VERSION — secure offline file transfer through animated QR codes."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "dist/MadixBeam-$VERSION.apk" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "dist/MadixBeam-$VERSION.apk" dist/SHA256SUMS.txt --title "Madix Beam $VERSION" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
