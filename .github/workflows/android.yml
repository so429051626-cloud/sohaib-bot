# MADIX Convert — بناء تطبيق أندرويد (APK) تلقائياً
# Py | Sohaib
name: Build Android App

on:
  push:
    branches: ['**']
    paths:
      - 'madix-convert/mobile/**'
      - 'madix-convert/assets/img/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'رابط السيرفر (مثال: https://madix-convert.xo.je)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: madix-convert/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: madix-convert/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Prepare app
        env:
          MADIX_SERVER_URL: ${{ github.event.inputs.server_url }}
          MADIX_VERSION: 1.0.${{ github.run_number }}
        run: |
          node build-www.mjs
          npx cap sync android

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            {
              echo "MADIX_KEYSTORE_PASSWORD=$KS_PASS"
              echo "MADIX_KEY_ALIAS=$KS_ALIAS"
              echo "MADIX_KEY_PASSWORD=${KS_KEYPASS:-$KS_PASS}"
            } >> "$GITHUB_ENV"
          else
            PASS=$(openssl rand -hex 16)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$KS" -alias madix -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=MADIX Convert, O=Py Sohaib, C=PS" -noprompt
            {
              echo "MADIX_KEYSTORE_PASSWORD=$PASS"
              echo "MADIX_KEY_ALIAS=madix"
              echo "MADIX_KEY_PASSWORD=$PASS"
            } >> "$GITHUB_ENV"
          fi
          echo "MADIX_KEYSTORE=$KS" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: madix-convert/mobile/android
        env:
          MADIX_VERSION_CODE: ${{ github.run_number }}
          MADIX_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p ../download
          cp android/app/build/outputs/apk/release/app-release.apk ../download/MADIX-Convert.apk
          ls -la ../download

      - uses: actions/upload-artifact@v4
        with:
          name: MADIX-Convert-apk
          path: madix-convert/download/MADIX-Convert.apk

      - name: Save APK in the project
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f madix-convert/download/MADIX-Convert.apk
          git commit -m "MADIX Convert APK 1.0.${{ github.run_number }} [skip ci]" || exit 0
          for i in 1 2 3 4; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep $((i * 5))
          done
